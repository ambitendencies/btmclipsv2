    async function initializeAudio() {
      if (!AppState.soundEnabled || audioInitialized) return;
      if (!audioLoading) audioLoading = new Promise((resolve,reject) => {

    function createNoiseBumpTexture() {

      for (let i = 0; i < imgData.data.length; i += 4) {

        imgData.data[i] = v;
        imgData.data[i + 1] = v;
        imgData.data[i + 2] = v;
        imgData.data[i + 3] = 255;

      ctx.putImageData(imgData, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;

      tex.repeat.set(6, 6);
      return tex;

    function drawRoundedRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    // Category artwork & vector glyph renderer shared by both Cartridges and AMOLED Screen
    function drawCategoryArtwork(ctx, track, x, y, w, h, isCartridge = false) {
      ctx.save();
      const skyGrad = ctx.createLinearGradient(0, y, 0, y + h);
      skyGrad.addColorStop(0, track.skyColors[0]);

      skyGrad.addColorStop(1, track.skyColors[3]);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(x, y, w, h);

      const cx = x + w * 0.54;
      const cy = y + h * 0.42;
      const sunR = Math.min(w, h) * 0.25;

      // Sun / Moon orb
      const sunGrad = ctx.createLinearGradient(0, cy - sunR, 0, cy + sunR);
      sunGrad.addColorStop(0, track.sunColors[0]);
      sunGrad.addColorStop(0.6, track.sunColors[1]);
      sunGrad.addColorStop(1, track.sunColors[2]);
      ctx.fillStyle = sunGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, sunR, 0, Math.PI * 2);
      ctx.fill();

      // Category-specific scenic illustration matching the reference image
      if (track.iconType === 'palm') {
        // 001 Nostalgia: Sunset city skyline + two palm silhouettes
        ctx.fillStyle = '#180c24';
        const bars = [0.08, 0.15, 0.24, 0.31, 0.39, 0.46, 0.53, 0.61, 0.68, 0.76, 0.84, 0.91];
        bars.forEach((bx, idx) => {
          const bh = (0.22 + ((idx * 37) % 28) / 100) * h;
          ctx.fillRect(x + bx * w, y + h - bh, w * 0.055, bh);
        });
        // Palms
        const drawPalm = (px, py, sc, flip) => {
          ctx.save();
          ctx.translate(px, py);
          ctx.scale(sc * flip, sc);
          ctx.strokeStyle = '#12081c';
          ctx.lineWidth = 8;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(0, 140);
          ctx.quadraticCurveTo(14, 70, 0, 0);
          ctx.stroke();
          [-2.5, -2.0, -1.5, -0.9, -0.3, 0.3].forEach((a) => {
            ctx.beginPath();

    function wrapText(ctx,text,x,y,width,lineHeight) {
      let line='';

        if (ctx.measureText(line+word).width>width && line) { ctx.fillText(line.trim(),x,y); line=''; y+=lineHeight; }
        line+=word+' ';

    function updateAmoledScreen() {
      const ctx = amoledCtx;
      const activeIdx = AppState.insertedIndex >= 0 ? AppState.insertedIndex : AppState.selectedIndex;
      const track = CARTRIDGE_REGISTRY[activeIdx];
      const isInserted = AppState.insertedIndex !== -1;
      const isPlaying = AppState.isPlayingAudio;
      const progressRatio = AppState.playbackProgress;

      ctx.clearRect(0, 0, 1024, 1024);

      // Pure AMOLED Black Background
      ctx.fillStyle = '#050507';
      ctx.fillRect(0, 0, 1024, 1024);

      // --- TOP STATUS BAR (Matches Reference) ---
      ctx.save();
      ctx.strokeStyle = '#ffffff';
      ctx.fillStyle = '#ffffff';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      const ix = 76, iy = 84;
      ctx.beginPath();
      ctx.moveTo(ix, iy); ctx.lineTo(ix + 26, iy + 26);
      ctx.moveTo(ix + 26, iy); ctx.lineTo(ix, iy + 26);
      ctx.stroke();
      [[ix, iy], [ix + 26, iy], [ix, iy + 26], [ix + 26, iy + 26]].forEach(([dx, dy]) => {
        ctx.beginPath();
        ctx.arc(dx, dy, 5.5, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.font = '700 50px Inter, -apple-system, sans-serif';
      ctx.fillText('benclips', 120, 114);
      ctx.font = '600 17px Inter, sans-serif';
      ctx.fillText('TM', 326, 84);

      // Glowing indicator dot next to benclips
      ctx.fillStyle = isInserted ? '#ff5500' : track.themeColor;
      ctx.beginPath();
      ctx.arc(340, 107, 9, 0, Math.PI * 2);
      ctx.fill();

      // Right: Time "10:24" & Battery icon
      ctx.fillStyle = '#f4f6fa';
      ctx.font = '500 42px Inter, sans-serif';
      ctx.fillText('10:24', 690, 113);

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4.5;
      drawRoundedRect(ctx, 842, 76, 86, 42, 9);
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(932, 88, 7, 18);
      drawRoundedRect(ctx, 850, 84, 62, 26, 5);
      ctx.fill();
      ctx.restore();

      // --- BOOTING STATE OVERLAY ---
      if (AppState.phase === 'booting') {
        ctx.save();
        ctx.fillStyle = track.themeColor;
        ctx.font = '600 32px "JetBrains Mono", monospace';
        ctx.fillText(`MOUNTING CARTRIDGE #${track.id}...`, 110, 440);
        ctx.fillStyle = '#ffffff';
        ctx.font = '700 64px Inter, sans-serif';
        ctx.fillText(track.category.toUpperCase(), 110, 525);
        drawRoundedRect(ctx, 110, 575, 804, 18, 9);
        ctx.strokeStyle = '#333';
        ctx.stroke();
        drawRoundedRect(ctx, 110, 575, 804 * Math.min(1, AppState.bootTimer * 3.2), 18, 9);
        ctx.fillStyle = track.themeColor;
        ctx.fill();
        ctx.restore();
        amoledTexture.needsUpdate = true;
        return;
      }

      // --- ROUNDED ALBUM ARTWORK / ARCHIVE CARD ---
      ctx.save();
      drawRoundedRect(ctx, 68, 150, 888, 455, 42);
      ctx.clip();

      const liveExperience=EXPERIENCES[track.experienceId];
      const frame=liveExperience?.action?.frames?.[AppState.interactionCount % liveExperience.action.frames.length];
      drawCategoryArtwork(ctx,frame && isInserted ? {...track,skyColors:frame} : track,68,150,888,455,false);
      if (isInserted && track.experienceId==='horticulture') {
        const growth=AppState.interactionCount;
        ctx.save(); ctx.strokeStyle='#163e28';ctx.lineWidth=10;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(512,590);ctx.lineTo(512,565-growth*48);ctx.stroke();
        for(let i=0;i<growth;i++) {
          ctx.fillStyle=i%2?'#83cba1':'#2f8051';ctx.beginPath();
          ctx.ellipse(512+(i%2?28:-28),550-i*42,40,16,i%2?-.5:.5,0,Math.PI*2);ctx.fill();
        }
        ctx.restore();
      }

      // If in 'archive' story view mode (toggled by tapping the 3 dots on screen), show curated archive notes
      if (AppState.screenViewMode === 'archive') {
        const experience=EXPERIENCES[track.experienceId];
        const entry=experience?.entries[AppState.screenPage % experience.entries.length];
        ctx.fillStyle='rgba(8,8,12,.88)'; ctx.fillRect(68,150,888,455);
        ctx.fillStyle=track.themeColor; ctx.font='500 25px "JetBrains Mono",monospace';
        ctx.fillText(`${track.category.toUpperCase()} / ${experience?.mode.toUpperCase() || 'ARCHIVE'}`,110,216);
        ctx.fillStyle='#fff'; ctx.font='600 42px Inter,sans-serif';
        ctx.fillText(entry?.title || track.storyNotes[0],110,285);
        ctx.font='400 31px Inter,sans-serif'; ctx.fillStyle='#e4dcd3';
        wrapText(ctx,entry?.text || track.storyNotes.join('. '),110,345,790,45);
        if(experience?.action) {
          ctx.fillStyle=track.themeColor; ctx.font='500 27px Inter,sans-serif';
          wrapText(ctx,interactionFeedback(experience),110,540,780,34);
        }
      } else {
        const botVig = ctx.createLinearGradient(0, 465, 0, 605);
        botVig.addColorStop(0, 'rgba(5, 5, 7, 0)');
        botVig.addColorStop(1, 'rgba(5, 5, 7, 0.9)');
        ctx.fillStyle = botVig;
        ctx.fillRect(68, 465, 888, 140);
      }
      ctx.restore();

      // --- TRACK TITLE & ARTIST ---
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 54px Inter, -apple-system, sans-serif';
      ctx.fillText(track.category, 84, 650);

      ctx.fillStyle = '#d5dbe6';
      ctx.font = '500 38px Inter, -apple-system, sans-serif';
      const statusSuffix = isInserted ? '' : ' (Ready)';
      ctx.font='500 32px Inter,sans-serif';
      ctx.fillText(`${EXPERIENCES[track.experienceId]?.title || track.title}${statusSuffix}`, 84, 706);

      // 3-Dots Menu Icon (toggles Archive Notes view)
      ctx.fillStyle = AppState.screenViewMode === 'archive' ? track.themeColor : '#ffffff';
      [632, 660, 688].forEach((dy) => {
        ctx.beginPath();
        ctx.arc(918, dy, 6.5, 0, Math.PI * 2);
        ctx.fill();
      });

      // --- PROGRESS SCRUBBER BAR ---
      const barX = 84, barY = 755, barW = 856, barH = 20;
      ctx.fillStyle = '#2d3039';
      drawRoundedRect(ctx, barX, barY, barW, barH, 10);
      ctx.fill();

      const activeW = Math.max(24, Math.min(barW, barW * progressRatio));
      const progGrad = ctx.createLinearGradient(barX, 0, barX + activeW, 0);
      progGrad.addColorStop(0, track.themeColor);
      progGrad.addColorStop(1, '#ffb3c6');
      ctx.fillStyle = progGrad;
      drawRoundedRect(ctx, barX, barY, activeW, barH, 10);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(barX + activeW, barY + barH / 2, 15, 0, Math.PI * 2);
      ctx.fill();

      const totalSecs = track.totalSecs;
      const curSecs = Math.floor(totalSecs * progressRatio);
      const mins = Math.floor(curSecs / 60);
      const secs = String(curSecs % 60).padStart(2, '0');
      ctx.fillStyle = '#dcdfe6';
      ctx.font = '500 32px Inter, sans-serif';
      ctx.fillText(`${mins}:${secs}`, 84, 820);
      ctx.fillText(track.duration, 862, 820);

      // --- MEDIA PLAYBACK CONTROLS ---
      ctx.fillStyle = '#ffffff';
      // Previous Track
      ctx.fillRect(226, 878, 10, 56);
      ctx.beginPath();
      ctx.moveTo(238, 906);
      ctx.lineTo(284, 878);
      ctx.lineTo(284, 934);
      ctx.closePath();
      ctx.fill();

      // Center Play / Pause Ring
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.arc(512, 906, 66, 0, Math.PI * 2);
      ctx.stroke();

      if (isPlaying) {
        drawRoundedRect(ctx, 488, 876, 15, 60, 4);
        ctx.fill();
        drawRoundedRect(ctx, 521, 876, 15, 60, 4);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.moveTo(494, 874);
        ctx.lineTo(494, 938);
        ctx.lineTo(546, 906);
        ctx.closePath();
        ctx.fill();
      }

      // Next Track
      ctx.beginPath();
      ctx.moveTo(740, 878);
      ctx.lineTo(786, 906);
      ctx.lineTo(740, 934);
      ctx.closePath();
      ctx.fill();
      ctx.fillRect(788, 878, 10, 56);

      amoledTexture.needsUpdate = true;
    }

      const phaseLabels = {
        idle: 'IDLE',
        selected: `SELECTED • #${track.id}`,
        dragging: `DRAGGING • #${track.id}`,
        aligning: `ALIGNING • #${track.id}`,
        inserting: `LOADING • #${track.id}`,
        booting: `BOOTING • #${track.id}`,
        active: AppState.isPlayingAudio ? `PLAYING • ${track.category.toUpperCase()}` : `LOADED • ${track.category.toUpperCase()}`,
        ejecting: 'EJECTING...'
      };
      stateBadge.textContent = phaseLabels[AppState.phase] || 'READY';

      // Update 3D selection halo color
      haloMat.uniforms.glowColor.value.set(CARTRIDGE_REGISTRY[AppState.selectedIndex].themeColor);
      selectionSpill.material.color.copy(haloMat.uniforms.glowColor.value);
      selectionPointLight.color.set(track.themeColor);

      renderDockCategoryLabels();
      const busy = isBusy();
      document.querySelectorAll('.cartridge-label, #btn-prev-cart, #btn-next-cart').forEach(el => el.disabled=busy);
      document.getElementById('accessible-play').textContent = AppState.insertedIndex < 0 ? 'Load / play' : AppState.isPlayingAudio ? 'Pause' : 'Play';
      document.getElementById('accessible-play').disabled = busy;
      document.getElementById('accessible-eject').disabled = AppState.insertedIndex < 0 || busy;
      document.getElementById('archive-toggle').disabled = AppState.phase !== 'active';
      document.getElementById('archive-toggle').setAttribute('aria-pressed',String(AppState.screenViewMode === 'archive'));
      updateAmoledScreen();
    }

    // ============================================================================
    // 10. CARTRIDGE INSERTION, EJECTION & 3D DRAG-TO-INSERT INTERACTION
    // ============================================================================
    let playerRecoilX = 0;

    function startInsertingCartridge(idx) {
      AppState.selectedIndex = idx;
      AppState.insertedIndex = idx;
      AppState.screenViewMode = 'player';
      AppState.screenPage = 0; AppState.interactionCount = 0; AppState.challengeProgress = 0; AppState.challengeFeedback = 'Enter the four-button code.';
      if(audioInitialized) Tone.Transport.seconds=0;
      const mesh = cartridgeMeshes[idx];
      mesh.userData.motionState = 'inserting';
      AppState.playbackProgress = 0;
      centerCartridge(idx);
      playMechanicalSound('insert');
      transitionState('aligning');
    }

    function triggerPhysicalEject() {
      if (isBusy()) return;
      if (AppState.insertedIndex === -1) {
        playMechanicalSound('click');
        return;
      }
      const idx = AppState.insertedIndex;
      const mesh = cartridgeMeshes[idx];
      mesh.userData.motionState = 'ejecting';
      AppState.insertedIndex = -1;
      playerRecoilX = 1.1; // Outward mechanical pop recoil
      playMechanicalSound('eject');
      toggleMusicPlayback(true);
      transitionState('ejecting');
    }

    function handleCartridgeTap(idx) {
      if (isBusy() || AppState.phase === 'dragging' || !CARTRIDGE_REGISTRY[idx]) return;
      void initAudio();

      AppState.selectedIndex = idx;

      // Tapping the currently inserted cartridge ejects it
      if (AppState.insertedIndex === idx) {
        AppState.pendingInsertIndex = -1;
        triggerPhysicalEject();
        return;
      }

      // If another cartridge is inserted, eject it first and queue the new one
      if (AppState.insertedIndex !== -1) {
        AppState.pendingInsertIndex = idx;
        triggerPhysicalEject();
        return;
      }

      // Otherwise smoothly arc & slide this cartridge into the player
      startInsertingCartridge(idx);
    }

    // --- RAYCASTER DRAG-TO-LOAD & TAP INTERACTION ---
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -DOCK_Z);
    const dragIntersectPoint = new THREE.Vector3();

    let draggedCartIndex = -1;
    let pointerDownPos = new THREE.Vector2();
    let isPointerDraggingCart = false;

    function updatePointerNDC(e) {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (isBusy() || e.button !== 0) return;
      renderer.domElement.setPointerCapture(e.pointerId);
      void initAudio();
      updatePointerNDC(e);
      pointerDownPos.set(e.clientX, e.clientY);
      raycaster.setFromCamera(pointer, camera);

      // 1. Check if clicking the Orange Eject Button on the player
      const orangeHits = raycaster.intersectObjects(parts.sliderButton.children, true);
      if (orangeHits.length > 0) {
        controls.enabled = false;
        triggerPhysicalEject();
        setTimeout(() => { controls.enabled = true; }, 150);
        return;
      }

      // 2. Check if tapping the AMOLED Touch Screen
      const screenHits = raycaster.intersectObject(amoledDisplayMesh, false);
      if (screenHits.length > 0) {
        controls.enabled = false;
        const uv = screenHits[0].uv;
        if (uv) {
          // Check 3-dots archive toggle region
          if (uv.x > 0.82 && uv.y > 0.25 && uv.y < 0.45) {
            if(AppState.phase !== 'active') return;
            AppState.screenViewMode = 'archive';
            playMechanicalSound('click');
            updateEditorialUI(); openModal('experience');
          } else if (uv.y>=.23 && uv.y<=.28 && AppState.phase==='active') {
            AppState.playbackProgress=THREE.MathUtils.clamp((uv.x-.082)/.84,0,1);
            if(audioInitialized) Tone.Transport.seconds=AppState.playbackProgress*trackDuration();
            updateAmoledScreen();
          } else if (uv.y < 0.20 && uv.x < 0.34) {
            // Previous cartridge shortcut
            const prevIdx = (AppState.selectedIndex - 1 + CARTRIDGE_REGISTRY.length) % CARTRIDGE_REGISTRY.length;
            handleCartridgeTap(prevIdx);
          } else if (uv.y < 0.20 && uv.x > 0.66) {
            // Next cartridge shortcut
            const nextIdx = (AppState.selectedIndex + 1) % CARTRIDGE_REGISTRY.length;
            handleCartridgeTap(nextIdx);
          } else {
            // Tap anywhere else on screen to Play/Pause (or auto-insert selected cartridge if none loaded)
            if (AppState.insertedIndex === -1) {
              handleCartridgeTap(AppState.selectedIndex);
            } else {
              playMechanicalSound('click');
              document.getElementById('accessible-play').click();
            }
          }
        }
        setTimeout(() => { controls.enabled = true; }, 150);
        return;
      }

      // 3. Check if grabbing one of the 8 Cartridges
      const cartHits = raycaster.intersectObjects(cartridgeLineupGroup.children, true);
      if (cartHits.length > 0) {
        const hitIdx = cartHits[0].object.userData.cartIndex;
        if (hitIdx !== undefined && cartridgeMeshes[hitIdx].userData.motionState === 'docked') {
          draggedCartIndex = hitIdx;
          AppState.selectedIndex = hitIdx;
          isPointerDraggingCart = false;
          controls.enabled = false; // Lock camera orbit while holding a cartridge
          playMechanicalSound('pickup');
          updateEditorialUI();
        }
      }
    });

    window.addEventListener('pointermove', (e) => {
      // Subtle flat-UI 3D camera parallax when not dragging a cartridge
      targetParallax.x = e.pointerType === 'touch' ? 0 : ((e.clientX / window.innerWidth) * 2 - 1) * .65;
      targetParallax.y = e.pointerType === 'touch' ? 0 : (-(e.clientY / window.innerHeight) * 2 + 1) * .35;

      if (draggedCartIndex === -1) return;

      const moveDist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      if (moveDist > 6 && !isPointerDraggingCart) {
        isPointerDraggingCart = true;
        // Only allow physical 3D dragging if the cartridge is currently in the dock
        const mesh = cartridgeMeshes[draggedCartIndex];
        if (mesh.userData.motionState === 'docked') {
          mesh.userData.motionState = 'dragging';
          transitionState('dragging');
        }
      }

      if (isPointerDraggingCart) {
        const mesh = cartridgeMeshes[draggedCartIndex];
        if (mesh.userData.motionState === 'dragging') {
          updatePointerNDC(e);
          raycaster.setFromCamera(pointer, camera);
          if (raycaster.ray.intersectPlane(dragPlane, dragIntersectPoint)) {
            mesh.position.set(
              THREE.MathUtils.clamp(dragIntersectPoint.x, -85, 85),
              THREE.MathUtils.clamp(dragIntersectPoint.y, -28, 36),
              DOCK_Z + 8
            );
            mesh.scale.setScalar(0.92);

            // Check proximity to the right-side cartridge port on the player
            const slotWorldPos = playerGroup.localToWorld(new THREE.Vector3(24,-5.2,0));
            const distToSlot = mesh.position.distanceTo(slotWorldPos);

            if (distToSlot < 25) {
              if (AppState.phase !== 'aligning') transitionState('aligning');
              slotDropHint.style.opacity = '1';
              slotDropHint.style.left = `${Math.min(innerWidth-155,e.clientX+16)}px`;
              slotDropHint.style.top = `${e.clientY - 16}px`;
            } else {
              if (AppState.phase !== 'dragging') transitionState('dragging');
              slotDropHint.style.opacity = '0';
            }
          }
        }
      }
    });

    window.addEventListener('pointerup', () => {
      if (draggedCartIndex === -1) return;
      const idx = draggedCartIndex;
      const mesh = cartridgeMeshes[idx];
      draggedCartIndex = -1;
      controls.enabled = true;
      slotDropHint.style.opacity = '0';

      if (!isPointerDraggingCart) {
        // Quick tap on a cartridge -> trigger tap-to-insert / tap-to-eject
        handleCartridgeTap(idx);
        return;
      }

      if (mesh.userData.motionState === 'dragging') {
        const slotWorldPos = playerGroup.localToWorld(new THREE.Vector3(24,-5.2,0));
        const distToSlot = mesh.position.distanceTo(slotWorldPos);

        if (distToSlot < 25) {
          // Dropped near the player slot -> complete insertion!
          mesh.userData.insertProgress = 0.56;
          if (AppState.insertedIndex !== -1 && AppState.insertedIndex !== idx) {
            AppState.pendingInsertIndex = idx;
            mesh.userData.motionState = 'docked';
            mesh.userData.insertProgress = 0;
            triggerPhysicalEject();
          } else {
            startInsertingCartridge(idx);
          }
        } else {
          // Dropped away from the slot -> return smoothly to dock tray
          mesh.userData.motionState = 'docked';
          mesh.userData.insertProgress = 0;
          transitionState(AppState.insertedIndex !== -1 ? 'active' : 'selected');
        }
      }
    });

    // ============================================================================
    function cancelDrag() {
      if (draggedCartIndex < 0) return;
      const mesh = cartridgeMeshes[draggedCartIndex];
      mesh.userData.motionState='docked'; mesh.userData.insertProgress=0;
      draggedCartIndex=-1; isPointerDraggingCart=false;
      controls.enabled=true; slotDropHint.style.opacity='0';
      transitionState(AppState.insertedIndex >= 0 ? 'active' : 'selected');
    }
    window.addEventListener('pointercancel',cancelDrag);
    window.addEventListener('blur',cancelDrag);

    // 11. UI CONTROLS, NAVIGATION & MODALS
    // ============================================================================
    const btnSound = document.getElementById('btn-sound');
    const soundLabel = document.getElementById('sound-label');
    const soundWaveIcon = document.getElementById('sound-wave-icon');

    btnSound.addEventListener('click', async () => {
      AppState.soundEnabled = !AppState.soundEnabled;
      if (AppState.soundEnabled) {
        await initAudio();
        if (AppState.phase === 'active' && !AppState.isPlayingAudio) toggleMusicPlayback();
      } else toggleMusicPlayback(true);
      soundLabel.textContent = AppState.soundEnabled ? 'SOUND ON' : 'SOUND OFF';
      btnSound.setAttribute('aria-pressed',String(AppState.soundEnabled));
      btnSound.setAttribute('aria-label',AppState.soundEnabled ? 'Disable sound' : 'Enable sound');
      updateEditorialUI();
    });
    document.getElementById('accessible-play').addEventListener('click', () => document.getElementById('instruction-play').click());
    document.getElementById('accessible-eject').addEventListener('click', () => {
      AppState.pendingInsertIndex=-1; triggerPhysicalEject();
    });
    document.getElementById('archive-toggle').addEventListener('click', () => {
      if (AppState.phase !== 'active') return;
      AppState.screenViewMode = AppState.screenViewMode === 'archive' ? 'player' : 'archive';
      updateEditorialUI();
      if(AppState.screenViewMode==='archive') openModal('experience');
    });

    document.getElementById('instruction-eject').addEventListener('click', () => {
      triggerPhysicalEject();
    });

    document.getElementById('instruction-play').addEventListener('click', () => {
      if (isBusy()) return;
      void initAudio();
      if (AppState.insertedIndex === -1) {
        handleCartridgeTap(AppState.selectedIndex);
      } else {
        playMechanicalSound('click');
        if (!AppState.soundEnabled) { btnSound.click(); return; }
        toggleMusicPlayback(false);
      }
    });

    function selectAdjacent(delta) {
      if (isBusy() || ['dragging','aligning'].includes(AppState.phase)) return;
      AppState.selectedIndex=(AppState.selectedIndex+delta+CARTRIDGE_REGISTRY.length)%CARTRIDGE_REGISTRY.length;
      centerCartridge(AppState.selectedIndex);
      playMechanicalSound('click');
      transitionState(AppState.insertedIndex < 0 ? 'selected' : 'active');
    }
    document.getElementById('btn-prev-cart').addEventListener('click',()=>selectAdjacent(-1));
    document.getElementById('btn-next-cart').addEventListener('click',()=>selectAdjacent(1));

    // Modal Handler for ABOUT & BEHIND THE BUILD
    const infoModal = document.getElementById('info-modal');
    const modalContent = document.getElementById('modal-content');

    let focusBeforeModal;
    function openModal(type) {
      focusBeforeModal=document.activeElement;
      infoModal.dataset.view=type;
      if (type === 'experience') {
        // The accessible reader mirrors the exact content rendered on the screen.
      } else if (type === 'about') {
        modalContent.innerHTML = `
          <span class="text-[10px] font-mono-tech uppercase tracking-[0.22em] text-orange-400">ABOUT THE ARCHIVE</span>
          <h2 class="font-editorial text-3xl text-white mt-1 mb-4">A tactile personal archive.</h2>
          <p class="text-sm text-stone-300 leading-relaxed mb-4">
            Inspired by late-90s pocket audio players and transparent industrial design, <strong>benclips™</strong> reimagines a personal portfolio and curiosity cabinet as eight physical data cartridges.
          </p>
          <p class="text-sm text-stone-300 leading-relaxed">
            Each cartridge stores a themed world—from 90s culture, Old School RuneScape, and custom hardware to horticulture, Chihuahuas, anime, and field notes. Drag or tap any cartridge into the side receiver to boot its audio-visual experience, or tap the <strong>[⋮]</strong> icon on the AMOLED screen to read the archive field notes.
          </p>
        `;
      } else {
        modalContent.innerHTML = `
          <span class="text-[10px] font-mono-tech uppercase tracking-[0.22em] text-orange-400">TECHNICAL ARCHITECTURE</span>
          <h2 class="font-editorial text-3xl text-white mt-1 mb-4">Behind the Build</h2>
          <ul class="space-y-2.5 text-xs sm:text-sm text-stone-300 leading-relaxed">
            <li>• <strong>Flat-Mated Polycarbonate Shell:</strong> Hollow extruded polycarbonate rims, molded ribs, visible PCB components, and engraved screw heads. Layered imagery supplies the studio without duplicate scenic meshes.</li>
            <li>• <strong>Guarded State Machine:</strong> Manages <em>Idle, Selected, Dragging, Aligning, Inserting, Booting, Active,</em> and <em>Ejecting</em> states with automatic swap queuing.</li>
            <li>• <strong>React Three Fiber:</strong> Owns the player, dock, lighting and frame lifecycle, reusing the original procedural model builders.</li>
            <li>• <strong>1024×1024 Live AMOLED Canvas:</strong> Self-illuminated topmost display layer with dynamic procedural artwork, scrubbing, interactive UV touch zones, and shared audio, visual, story and interactive experiences. Playback refreshes at 10 Hz.</li>
            <li>• <strong>Tone.js Chiptune & Foley Synth:</strong> Optional, lazily loaded original synth loops and mechanical foley. No commercial song recordings are included.</li>
          </ul>
        `;
      }
      infoModal.classList.remove('hidden');
      infoModal.classList.add('flex');
      document.querySelector('main').inert=true; document.querySelector('header').inert=true;
      syncExperiencePanel();
      document.getElementById('btn-close-modal').focus();
    }

    document.querySelectorAll('[data-nav]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const nav = btn.getAttribute('data-nav');
        if (nav === 'collection') {
          dockLabelsGrid.children[AppState.selectedIndex]?.focus();
        } else {
          openModal(nav);
        }
      });
    });

    document.getElementById('btn-info-mobile').addEventListener('click', () => openModal('about'));
    document.getElementById('btn-close-modal').addEventListener('click', () => {
      infoModal.classList.add('hidden');
      infoModal.classList.remove('flex');
      document.querySelector('main').inert=false; document.querySelector('header').inert=false;
      AppState.screenViewMode='player'; updateEditorialUI();
      focusBeforeModal?.focus();
    });
    infoModal.addEventListener('click', (e) => {
      if (e.target === infoModal) {
        document.getElementById('btn-close-modal').click();
      }
    });

    // ============================================================================
    function trackDuration() { return CARTRIDGE_REGISTRY[AppState.insertedIndex < 0 ? AppState.selectedIndex : AppState.insertedIndex].totalSecs; }
    function interactionFeedback(experience) {
      if(experience.action.kind==='memory') return AppState.challengeFeedback;
      if(experience.action.kind==='bits') return `${AppState.interactionCount.toString(2).padStart(4,'0')} binary = ${AppState.interactionCount} decimal`;
      return experience.action.messages[AppState.interactionCount % experience.action.messages.length];
    }
    function interactionControls(experience) {
      if(!experience.action) return '';
      if(experience.action.kind==='memory') return `<div class="interaction-controls">${[1,2,3,4].map(n=>`<button data-pad="${n}" aria-label="Memory button ${n}">${n}</button>`).join('')}</div>`;
      if(experience.action.kind==='bits') return `<div class="interaction-controls">${[8,4,2,1].map(bit=>`<button data-bit="${bit}" aria-label="Toggle bit ${bit}" aria-pressed="${Boolean(AppState.interactionCount & bit)}">${AppState.interactionCount & bit ? '1' : '0'}<small>${bit}</small></button>`).join('')}</div>`;
      return `<button class="archive-action" id="experience-action">${experience.action.label}</button>`;
    }
    function currentExperience() {
      const track=CARTRIDGE_REGISTRY[AppState.insertedIndex < 0 ? AppState.selectedIndex : AppState.insertedIndex];
      return {track,experience:EXPERIENCES[track.experienceId]};
    }
    function syncExperiencePanel() {
      if (infoModal.dataset.view !== 'experience' || infoModal.classList.contains('hidden')) return;
      const {track,experience}=currentExperience();
      if (!experience) return;
      const entry=experience.entries[AppState.screenPage % experience.entries.length];
      modalContent.innerHTML=`<span>${track.id} / ${track.category} · ${experience.mode}</span>
        <h2>${entry.title}</h2><p>${entry.text}</p>
        ${experience.action ? `<p id="interaction-feedback" role="status">${interactionFeedback(experience)}</p>${interactionControls(experience)}` : ''}
        <div class="archive-pagination"><button id="note-prev" aria-label="Previous field note">← Previous</button><span>${AppState.screenPage+1} / ${experience.entries.length}</span><button id="note-next" aria-label="Next field note">Next →</button></div>
        <p class="audio-caption">${experience.mode==='audio' ? 'Original synthesized loop · enable sound to listen.' : 'Field notes from the collection · illustrated on the player.'}</p>`;
      const changePage=delta=>{
        AppState.screenPage=(AppState.screenPage+delta+experience.entries.length)%experience.entries.length;
        syncExperiencePanel(); updateAmoledScreen();
        document.getElementById(delta>0?'note-next':'note-prev').focus();
      };
      document.getElementById('note-prev').onclick=()=>changePage(-1);
      document.getElementById('note-next').onclick=()=>changePage(1);
      modalContent.querySelectorAll('[data-pad]').forEach(button=>button.onclick=()=>{
        const value=Number(button.dataset.pad);
        const sequence=experience.action.sequence;
        if(AppState.challengeProgress===sequence.length) AppState.challengeProgress=0;
        if(value===sequence[AppState.challengeProgress]) {
          AppState.challengeProgress++;
          AppState.challengeFeedback=AppState.challengeProgress===sequence.length ? 'Quest complete. Code remembered.' : `${AppState.challengeProgress} / ${sequence.length} correct. Keep going.`;
        } else {
          AppState.challengeProgress=0; AppState.challengeFeedback='A wrong turn. Try the code again: 1 → 3 → 2 → 1.';
        }
        playMechanicalSound('click');syncExperiencePanel();updateAmoledScreen();
        modalContent.querySelector(`[data-pad="${value}"]`).focus();
      });
      modalContent.querySelectorAll('[data-bit]').forEach(button=>button.onclick=()=>{
        const bit=Number(button.dataset.bit);AppState.interactionCount ^= bit;
        playMechanicalSound('click');syncExperiencePanel();updateAmoledScreen();
        modalContent.querySelector(`[data-bit="${bit}"]`).focus();
      });
      const action=document.getElementById('experience-action');
      if(action) action.onclick=()=>{
        AppState.interactionCount=(AppState.interactionCount+1)%experience.action.messages.length;
        playMechanicalSound('click'); syncExperiencePanel(); updateAmoledScreen();
        document.getElementById('experience-action').focus();
      };
    }
    document.addEventListener('keydown', e => {
      if (!infoModal.classList.contains('hidden')) {
        if (e.key==='Escape') document.getElementById('btn-close-modal').click();
        if (e.key==='Tab') {
          const controls=Array.from(infoModal.querySelectorAll('button:not(:disabled),a[href],input'));
          const first=controls[0],last=controls.at(-1);
          if(e.shiftKey && document.activeElement===first) {e.preventDefault();last.focus();}
          else if(!e.shiftKey && document.activeElement===last) {e.preventDefault();first.focus();}
        }
        return;
      }
      if (e.key==='Escape') { cancelDrag(); if(!isBusy()) triggerPhysicalEject(); }
      if (e.target.closest('.cartridge-label') && ['ArrowLeft','ArrowRight'].includes(e.key)) {
        e.preventDefault(); selectAdjacent(e.key==='ArrowRight'?1:-1);
        dockLabelsGrid.children[AppState.selectedIndex]?.focus();
      }
    });

    // 12. RENDER LOOP & TWO-STAGE MECHANICAL CHOREOGRAPHY
    // ============================================================================
    transitionState('selected');
    const clock = new THREE.Clock();
    let lastScreenUpdate = 0;
    let cameraFocus = 1;

    function easeInOutCubic(x) {
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    }
    function easeOutBack(x) {
      const c1 = 1.45;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    function animate() {

      const dt = Math.min(clock.getDelta(), 0.1);
      const t = clock.getElapsedTime();

      // Smooth carousel scroll
      carouselScrollX += (targetCarouselScrollX - carouselScrollX) * (1 - Math.exp(-12 * dt));

      // Responsive player horizontal offset (centered on mobile, right-of-editorial-copy on desktop)
      const mobile = window.innerWidth <= 900 && innerWidth < innerHeight;
      const desiredPlayerX = mobile ? -1.5 : worldWidth * 0.045;
      PLAYER_BASE_POS.y = worldHeight * (mobile ? (innerHeight<700?.05:.005) : .09);
      DOCK_Y = worldHeight * (mobile ? (innerHeight<700?-.35:-.31) : -.245);
      playerGroup.scale.setScalar(mobile ? 1 : 1.2);
      playerGroup.rotation.set(-.035,-.10,.015);
      trayPlinth.position.y = DOCK_Y - 8.5;
      PLAYER_BASE_POS.x += (desiredPlayerX - PLAYER_BASE_POS.x) * (1 - Math.exp(-8 * dt));

      // Keep studio props visible across viewports, scaled slightly on smaller screens


      // Smooth pointer parallax for a tactile flat-UI 3D presentation
      pointerParallax.lerp(reducedMotion.matches ? new THREE.Vector2() : targetParallax, 1 - Math.exp(-6 * dt));
      const focusTarget = reducedMotion.matches ? 1 : AppState.phase === 'active' ? .985 : 1;
      cameraFocus += (focusTarget-cameraFocus)*(1-Math.exp(-4*dt));
      camera.position.set(
        cameraPosBase.x + pointerParallax.x,
        cameraPosBase.y + pointerParallax.y,
        cameraPosBase.z * cameraFocus
      );

      // Spring-damped mechanical recoil when cartridge snaps in or ejects
      playerRecoilX += (0 - playerRecoilX) * (1 - Math.exp(-14 * dt));
      playerGroup.position.set(
        PLAYER_BASE_POS.x + playerRecoilX,
        PLAYER_BASE_POS.y,
        PLAYER_BASE_POS.z
      );

      deskShadowCatcher.position.set(playerGroup.position.x,playerGroup.position.y-23.7*playerGroup.scale.x,-8);

      // Subtle keyring pendulum sway from player recoil
      parts.keyring.rotation.z = THREE.MathUtils.lerp(parts.keyring.rotation.z, -playerRecoilX * 0.08, 1 - Math.exp(-10 * dt));

      // Update Selection Halo Frame on the Dock Tray
      const selDockPos = getCartridgeDockPos(AppState.selectedIndex);
      const selectedCartridge=cartridgeMeshes[AppState.selectedIndex];
      const isSelectedInDock=selectedCartridge.userData.motionState==='docked';
      cartridgeMeshes.forEach((cartridge,index)=>{cartridge.userData.innerLight.visible=index===AppState.selectedIndex;});
      selectionPointLight.position.copy(selectedCartridge.position);
      selectionSpill.visible=isSelectedInDock;
      selectionSpill.position.set(selDockPos.x,DOCK_Y-7.7,DOCK_Z+6);
      selectionPointLight.intensity = isSelectedInDock ? 7 + (reducedMotion.matches ? 0 : Math.sin(t * 4) * 1.5) : 0;

      // Slot Staging & Seated Target Coordinates
      // Receiver positions and cartridge orientation share the player transform.
      playerGroup.updateMatrixWorld(true);
      const STAGING_POS=playerGroup.localToWorld(new THREE.Vector3(41,-5.2,0));
      const SEATED_POS=playerGroup.localToWorld(new THREE.Vector3(21.8,-5.2,0));

      let anyEjecting = false;

      cartridgeMeshes.forEach((mesh, idx) => {
        const mState = mesh.userData.motionState;
        if (mState === 'dragging') return; // Controlled directly by pointer raycaster

        const dockPos = getCartridgeDockPos(idx);
        const isSelected = AppState.selectedIndex === idx;
        if (isSelected) dockPos.y += 0.9;

        if (mState === 'inserting') {
          mesh.userData.insertProgress = Math.min(1, mesh.userData.insertProgress + dt * (reducedMotion.matches ? 5 : .9));
          if (mesh.userData.insertProgress >= .58 && AppState.phase === 'aligning') transitionState('inserting');
          if (mesh.userData.insertProgress >= 1) {
            mesh.userData.motionState = 'inserted';
            playerRecoilX = -1.35; // Crisp mechanical snap recoil to the left
            playMechanicalSound('snap');
            AppState.bootTimer = 0;
            transitionState('booting');
          }
        } else if (mState === 'ejecting') {
          anyEjecting = true;
          mesh.userData.insertProgress = Math.max(0, mesh.userData.insertProgress - dt * (reducedMotion.matches ? 5 : 1.3));
          if (mesh.userData.insertProgress <= 0) {
            mesh.userData.motionState = 'docked';
            if (AppState.pendingInsertIndex === -1) {
              transitionState('selected');
            }
          }
        }

        const p = mesh.userData.insertProgress;

        if (p <= 0.0001) {
          // Seated in the Brushed Aluminum Collection Dock
          mesh.position.lerp(dockPos, 1 - Math.exp(-12 * dt));
          mesh.scale.lerp(new THREE.Vector3(DOCK_SCALE, DOCK_SCALE, DOCK_SCALE), 1 - Math.exp(-12 * dt));
          mesh.quaternion.copy(DOCK_QUATERNION);
        } else if (p < 0.58) {
          // Stage 1: Lift out of dock tray, scale up to 1:1 physical size, and arc around to the right-side port
          const u = easeInOutCubic(p / 0.58);
          const arcPos = new THREE.Vector3().lerpVectors(dockPos, STAGING_POS, u);
          arcPos.z += Math.sin(u * Math.PI) * (reducedMotion.matches ? 0 : 10.0);
          arcPos.y += Math.sin(u * Math.PI) * (reducedMotion.matches ? 0 : 4.0);
          mesh.position.copy(arcPos);
          const sc = THREE.MathUtils.lerp(DOCK_SCALE, playerGroup.scale.x, u);
          mesh.scale.setScalar(sc);
          mesh.quaternion.slerpQuaternions(DOCK_QUATERNION,playerGroup.quaternion,u);
        } else {
          // Stage 2: Aligned with the slot — slide horizontally along X into the receiver
          const rawU = (p - 0.58) / 0.42;
          const u = mState === 'inserting' ? easeOutBack(rawU) : easeInOutCubic(rawU);
          mesh.position.lerpVectors(STAGING_POS, SEATED_POS, u);
          mesh.scale.copy(playerGroup.scale);
          mesh.quaternion.copy(playerGroup.quaternion);
        }
      });

      // Handle Booting -> Active transition
      if (AppState.phase === 'booting') {
        AppState.bootTimer += dt;
        updateAmoledScreen();
        if (AppState.bootTimer >= 0.42) {
          transitionState('active');
          toggleMusicPlayback(false);
        }
      }

      // If a cartridge swap was queued, insert the new cartridge once the previous one finishes ejecting
      if (AppState.pendingInsertIndex !== -1 && !anyEjecting) {
        const nextIdx = AppState.pendingInsertIndex;
        AppState.pendingInsertIndex = -1;
        startInsertingCartridge(nextIdx);
      }

      // Orange slider button depresses when cartridge is seated
      const activeMesh = AppState.insertedIndex !== -1 ? cartridgeMeshes[AppState.insertedIndex] : null;
      const slideDepth = activeMesh && activeMesh.userData.insertProgress > 0.65
        ? (activeMesh.userData.insertProgress - 0.65) / 0.35
        : 0;
      const sliderTargetY = -2.4 * THREE.MathUtils.clamp(slideDepth, 0, 1);
      parts.sliderButton.position.lerp(new THREE.Vector3(0, sliderTargetY, 0), 1 - Math.exp(-14 * dt));

      // Live playback scrubber update
      if (AppState.isPlayingAudio && AppState.insertedIndex !== -1) {
        const curTrack = CARTRIDGE_REGISTRY[AppState.insertedIndex];
        AppState.playbackProgress = (Tone.Transport.seconds % curTrack.totalSecs) / curTrack.totalSecs;
        if (t - lastScreenUpdate > .1) { updateAmoledScreen(); lastScreenUpdate = t; }
      }

      controls.update();
      syncProjectedUI();
    }

    function Player() { return React.createElement('primitive',{object:playerGroup,dispose:null}); }
    function CartridgeCollection() { return React.createElement('primitive',{object:dockSystemGroup,dispose:null}); }
    function StudioLighting() {
      return React.createElement(React.Fragment,null,
        ...[sunKeyLight,studioFillLight,warmRimLight,deskShadowCatcher].map(object=>React.createElement('primitive',{key:object.uuid,object,dispose:null}))
      );
    }
    function SceneAssembly() {
      useFrame(animate);
      return React.createElement(React.Fragment,null,React.createElement(Player),React.createElement(CartridgeCollection),React.createElement(StudioLighting));
    }
    const fiberRoot = createRoot(renderer.domElement);
    function configureRoot() {
      fiberRoot.configure({ gl:renderer,scene,camera,shadows:'soft',dpr:Math.min(devicePixelRatio,1.5),
        size:{width:innerWidth,height:innerHeight},frameloop:document.hidden?'never':'always' });
    }
    configureRoot();
    fiberRoot.render(React.createElement(SceneAssembly));
    document.addEventListener('visibilitychange',configureRoot);
    document.getElementById('scene-loading').hidden = true;

    window.addEventListener('resize', () => {
      computeResponsiveFraming();
      centerCartridge(AppState.selectedIndex);
      camera.position.copy(cameraPosBase);
      controls.target.copy(cameraTargetBase);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      configureRoot();
    });
  </script>
</body>
</html>
